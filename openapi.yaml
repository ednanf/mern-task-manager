openapi: 3.0.3

info:
  title: MERN Task Manager API
  version: 1.0.0
  description: |
    RESTful API of the **MERN Task Manager** application (MongoDB + Express + React + Node.js).

    The API exposes user authentication (JWT) and full CRUD operations over tasks, with
    strict per-user data isolation: every task is owned by the user that created it and
    is only visible to that user.

    ---

    ## Base URL

    All routes are mounted under the `/api/v1` prefix.

    | Environment | Base URL                                   |
    | ----------- | ------------------------------------------ |
    | Local       | `http://localhost:8000/api/v1`             |
    | Production  | `https://mern-task-manager-syry.onrender.com/api/v1` |

    The local port is defined by the `PORT` environment variable (`backend/.env`).

    ## Authentication flow

    1. Create an account with `POST /auth/register`, or obtain a token with `POST /auth/login`.
    2. Both endpoints answer with `{ "token": "<jwt>", "user": "<name>" }`.
    3. Send the token on every protected request:

       ```http
       Authorization: Bearer <jwt>
       ```

    4. `GET /auth/check` validates the token and reports the session state.

    The JWT is signed with HS256 using `JWT_SECRET` and expires after `JWT_LIFETIME`
    (`30d` by default). Its payload is `{ userId, name, iat, exp }`.

    ## Response envelopes

    Successful task responses are wrapped in an envelope:

    ```json
    { "status": "success", "data": { } }
    ```

    Errors are **not** uniform — three different shapes exist depending on where the
    error originated. Clients must handle all of them:

    | Shape                                                        | Produced by                                     | Typical status |
    | ------------------------------------------------------------ | ----------------------------------------------- | -------------- |
    | `{ "msg": "..." }`                                            | `POST /auth/register` (own try/catch)           | 400            |
    | `{ "status": "error", "data": { "code": 400, "message": "…" } }` | Central error handler with an `HttpError`        | 400 / 401 / 404 |
    | `{ "status": "error", "data": { "message": "…" } }`           | Central error handler with a Mongoose error      | 500            |

    The third shape has **no `code` property** because Mongoose errors do not carry an
    HTTP status. This is why schema violations (for example a task title longer than
    25 characters) are reported with HTTP **500** instead of 400.

    ## Security

    * **Helmet** sets the usual hardening headers (`Content-Security-Policy`,
      `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`,
      `X-Frame-Options: SAMEORIGIN`, `Referrer-Policy: no-referrer`, …) and removes
      `X-Powered-By`.
    * **CORS** is restricted to the allowed origins
      `http://localhost:5173`, `https://localhost:5173`,
      `https://mern-task-manager-eight.vercel.app` and `https://taskmanager.frizzera.dev`,
      with `Access-Control-Allow-Credentials: true`.
    * **XSS sanitization** (`express-xss-sanitizer` v2 / `sanitize-html`) is applied to the
      request `body`, `params`, `query` and `headers`. `&lt;script&gt;`, `&lt;style&gt;`,
      `&lt;iframe&gt;`, `&lt;svg&gt;` and `&lt;img&gt;` payloads are removed entirely, safe
      tags such as `&lt;b&gt;` are kept, and the characters `&`, `<` and `>` are
      HTML-escaped to `&amp;`, `&lt;` and `&gt;`.
      Escaping happens **before** validation, so a sanitized string can exceed the
      25-character title limit even when the original payload did not.
    * **Rate limiting**: at most **100 requests per 15 minutes per IP**; exceeding it
      yields HTTP 429 with the plain-text body `Too many requests, please try again later.`
      Every response exposes `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
      `X-RateLimit-Reset` (Unix timestamp, in seconds); the 429 response additionally
      carries `Retry-After`.
    * Passwords are hashed with **bcrypt** (10 salt rounds) and never returned by the API.

    ## Conventions

    * All identifiers are MongoDB `ObjectId`s, serialized as 24-character hexadecimal strings.
    * Timestamps are ISO 8601 / RFC 3339 strings in UTC.
    * Request bodies must be sent as `Content-Type: application/json`; the JSON body
      parser accepts payloads up to 100 kB by default. A body that is not valid JSON is
      rejected with HTTP 400 and the standard error envelope.
    * A request that does not match any route answers with HTTP 404 and
      `{ "status": "error", "data": { "code": 404, "message": "Route not found" } }`.
